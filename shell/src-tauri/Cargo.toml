[package]
name = "prompt-maxxer"
version = "0.1.0"
description = "Prompt Maxxer - push-to-talk dictation"
authors = ["Prompt Maxxer"]
edition = "2021"

[lib]
name = "prompt_maxxer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-updater = "2.11.0"
# Re-checking a staged update's signature before running it, with the same
# libraries the updater plugin verifies downloads with.
base64 = "0.22"
minisign-verify = "0.2"
semver = "1"

[target.'cfg(windows)'.dependencies]
# Job objects, so the engine cannot outlive the shell even if the shell is
# force-killed. An orphaned engine keeps a global keyboard hook installed.
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
winreg = "0.56.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
