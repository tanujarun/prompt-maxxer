<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Prompt Maxxer overlay</title>
    <link rel="stylesheet" href="/src/theme.css" />
    <link rel="stylesheet" href="/src/overlay.css" />
  </head>
  <body class="state-idle">
    <div class="lcd" role="status" aria-live="polite">
      <div class="row top">
        <span class="indicator" aria-hidden="true"></span>
        <span class="mode" id="mode">STBY</span>
        <span class="counter" id="counter"></span>
        <span class="readout" id="readout"></span>
      </div>
      <div class="row main">
        <div class="vu" id="vu" aria-hidden="true"></div>
        <div class="text" id="text">
          <span class="line" id="line"><span class="stable" id="stable"></span><span class="tentative" id="tentative"></span><span class="cursor" aria-hidden="true"></span></span>
          <span class="message" id="message" hidden></span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/overlay.ts"></script>
  </body>
</html>
